<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Devansh Kashyap — software developer building interpreters, database engines and terminal tools from scratch in C and C++." />
  <meta name="theme-color" content="#0f0f11" />
  <link rel="icon" type="image/png" href="/src/assets/img/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet" />

  <title>Devansh Kashyap — Software Developer</title>

  <!-- Apply the saved theme before first paint so there is no flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
